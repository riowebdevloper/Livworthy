      <stop offset="0%" stopColor="#0B4B82" />
      <stop offset="50%" stopColor="#0D6E78" />
      <stop offset="100%" stopColor="#148D80" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="15" y1="65" x2="68" y2="25" gradientUnits="userSpaceOnUse">
