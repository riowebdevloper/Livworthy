  <!-- Wordmark -->
  <text x="108" y="52" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#102A2E">Liv</text>
  <text x="168" y="52" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#167D75">Worth</text>
  <text x="306" y="28" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#102A2E">TM</text>

  <!-- Tagline -->
  <text x="110" y="72" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#102A2E" letter-spacing="0.25em">A BRIGHTER LIFE, ANYWHERE</text>
