      function sanitizeAnalyticsUrl(rawUrl) {
        if (!rawUrl) return '';
        try {
          var origin = window.location && window.location.origin ? window.location.origin : 'https://www.livworthy.com';
          var u = new URL(rawUrl, origin);
          var sp = new URLSearchParams(u.search);
          var cleanSp = new URLSearchParams();
          for (var i = 0; i < ALLOWED_ANALYTICS_PARAMS.length; i++) {
            var param = ALLOWED_ANALYTICS_PARAMS[i];
            if (sp.has(param)) {
              var val = sp.get(param);
              if (val !== null) cleanSp.set(param, val);
            }
          }
          var cleanQ = cleanSp.toString();
          u.search = cleanQ ? '?' + cleanQ : '';
          u.hash = '';
          return u.toString();
        } catch (e) {
          return rawUrl.split('?')[0].split('#')[0] || '/';
        }
      }

      function sanitizeAnalyticsPath(rawPath) {
        if (!rawPath) return '/';
        try {
          var origin = window.location && window.location.origin ? window.location.origin : 'https://www.livworthy.com';
          var u = new URL(rawPath, origin);
          var sp = new URLSearchParams(u.search);
          var cleanSp = new URLSearchParams();
          for (var i = 0; i < ALLOWED_ANALYTICS_PARAMS.length; i++) {
            var param = ALLOWED_ANALYTICS_PARAMS[i];
            if (sp.has(param)) {
              var val = sp.get(param);
              if (val !== null) cleanSp.set(param, val);
            }
          }
          var cleanQ = cleanSp.toString();
          return u.pathname + (cleanQ ? '?' + cleanQ : '');
        } catch (e) {

      var savedConsent = null;

      // Advanced Consent Mode: denies storage by default while permitting modeled cookieless pings before user consent

    <!-- Production-only analytics/ads with consent gating -->
    <script type="text/javascript">
      (function () {
        var host = window.location.hostname;
        var isCanonicalProduction = host === 'www.livworthy.com' || host === 'livworthy.com';
        if (!isCanonicalProduction) return;

        function loadMarketing() {
          if (window._adsLoaded) return;
          window._adsLoaded = true;
          var ads = document.createElement('script');
          ads.async = true;
          ads.crossOrigin = 'anonymous';
          ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9082698285506451';
          document.head.appendChild(ads);
        }

        function loadAnalytics() {
          if (window._clarityLoaded) return;
          window._clarityLoaded = true;
          window.clarity = window.clarity || function () {
            (window.clarity.q = window.clarity.q || []).push(arguments);
          };
          var clarity = document.createElement('script');
          clarity.async = true;
          clarity.src = 'https://www.clarity.ms/tag/yqkv1huqhm?ref=bwt';
          document.head.appendChild(clarity);
        }

        try {
          var rawConsent = localStorage.getItem('livworthy_cookie_consent');
          if (rawConsent) {
            var parsed = JSON.parse(rawConsent);
            if (parsed.analytics) loadAnalytics();
            if (parsed.marketing) loadMarketing();
          }
        } catch (e) {}

        window.addEventListener('livworthy:consent-updated', function (e) {
          if (e.detail && e.detail.analytics) loadAnalytics();
          if (e.detail && e.detail.marketing) loadMarketing();
        });
      })();
    </script>
